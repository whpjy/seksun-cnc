name: seksun-cnc

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CNC_STORAGE_ROOT: /var/lib/seksun-cnc/jobs
      CNC_ANALYZER_BIN: /opt/seksun-cnc/bin/occt-analyzer
      CNC_FREECAD_CMD: FreeCADCmd
      CNC_CAMOTICS_CMD: camsim
      CNC_MAX_UPLOAD_MB: "200"
      CNC_CORS_ORIGINS: http://localhost:5174,http://localhost:3001
      CNC_PUBLIC_BASE_URL: ${CNC_PUBLIC_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-max-0902}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-120}
      QWEN_PLANNING_THINKING: ${QWEN_PLANNING_THINKING:-false}
      CNC_AGENT_MODE: ${CNC_AGENT_MODE:-shadow}
      CNC_AGENT_CHECKPOINTER: ${CNC_AGENT_CHECKPOINTER:-sqlite}
      CNC_AGENT_CHECKPOINT_PATH: ${CNC_AGENT_CHECKPOINT_PATH:-/var/lib/seksun-cnc/jobs/langgraph.sqlite}
      CNC_AGENT_MAX_LOCAL_RETRIES: ${CNC_AGENT_MAX_LOCAL_RETRIES:-3}
      CNC_AGENT_MAX_SETUP_REPLANS: ${CNC_AGENT_MAX_SETUP_REPLANS:-1}
      CNC_AGENT_MAX_GLOBAL_REPLANS: ${CNC_AGENT_MAX_GLOBAL_REPLANS:-1}
      CNC_AGENT_HUMAN_REVIEW_ENABLED: ${CNC_AGENT_HUMAN_REVIEW_ENABLED:-true}
    volumes:
      - ./.seksun-cnc:/var/lib/seksun-cnc
    ports:
      - "8090:8090"
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-NEXUS CNC}
        VITE_PAGE_TITLE: ${VITE_PAGE_TITLE:-智能工艺规划}
        VITE_APP_LOGO_TEXT: ${VITE_APP_LOGO_TEXT:-N}
    depends_on:
      - api
    ports:
      - "3001:80"
    restart: unless-stopped
